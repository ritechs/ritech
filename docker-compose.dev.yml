# Local development database: `npm run services:up`
name: ritechs-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ritechs
      POSTGRES_USER: ritechs
      POSTGRES_PASSWORD: ritechs
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
volumes:
  pgdata-dev:
